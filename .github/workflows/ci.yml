name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Addis APS 11: CI runs in fresh mirab VMs.
jobs:
  web:
    runs-on: mirab-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm run build
  native:
    runs-on: mirab-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml
  app:
    # The real app on Linux, through tauri-driver: the window, the Rust
    # commands and the database together (tests/e2e/smoke.mjs).
    runs-on: mirab-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: cargo install tauri-driver --locked
      - run: npx tauri build --debug --no-bundle
      - run: |
          xvfb-run -a sh -c 'tauri-driver & sleep 3; node tests/e2e/smoke.mjs "$PWD/src-tauri/target/debug/gild-desktop"'
