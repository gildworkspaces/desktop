name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Addis APS 11 says fresh mirab VMs. This org has no mirab runner yet, so the
# jobs use the temporary host runners (Sami, 30 Oct). Each job runs inside a
# fresh container that gets the checkout through stdin and writes nothing
# back, so nothing is installed or left on the host.
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        job: [web, native, app]
    name: ${{ matrix.job }}
    runs-on: host-linux-x64
    steps:
      - uses: actions/checkout@v4
      - run: tar -c --exclude=.git . | docker run --rm -i node:24-bookworm bash -c 'mkdir /w && tar -x -C /w && cd /w && ci/linux.sh ${{ matrix.job }}'
