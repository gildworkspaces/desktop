[package]
name = "gild-desktop"
version = "0.16.0"
description = "gild: the open workspace where people and agents work together"
license = "Apache-2.0"
repository = "https://github.com/gildworkspaces/desktop"
edition = "2021"
rust-version = "1.85"

[lib]
name = "gild_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Turso's Rust rewrite of SQLite (MIT): the workspace database. The same
# engine and the same exact pin as Zega+SQLite (zegadb/zega), so the two can
# share a file format later.
turso_core = "=0.8.3"
gix = { version = "0.90.0", default-features = false, features = ["sha1"] }
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", features = ["net", "rt", "macros", "sync", "time", "process", "io-util"] }
sha2 = "0.11.0"
getrandom = "0.3"
tokio-util = "0.7"
http = "1"
# Line diffs of agents' proposed doc edits (Apache-2.0, pure Rust).
similar = "2.7"
tauri-plugin-notification = "2"
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
wat = "1"
