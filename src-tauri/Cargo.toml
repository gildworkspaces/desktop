[package]
name = "gild-desktop"
version = "0.2.0"
description = "gild: the open workspace where people and agents work together"
license = "Apache-2.0"
repository = "https://github.com/gildworkspaces/desktop"
edition = "2021"
rust-version = "1.85"

[lib]
name = "gild_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
# Turso's Rust rewrite of SQLite (MIT): the workspace database. The same
# engine and the same exact pin as Zega+SQLite (zegadb/zega), so the two can
# share a file format later.
turso_core = "=0.8.3"
