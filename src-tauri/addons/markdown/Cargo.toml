[package]
name = "gild-addon-markdown"
version = "0.1.0"
edition = "2021"
description = "gild's Markdown add-on: its editor, built as a WebAssembly module the app runs in a sandbox."
license = "MIT"
publish = false

# Its own crate, outside the app's: an add-on is built and shipped apart.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
